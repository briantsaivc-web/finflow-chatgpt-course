<!doctype html><html lang="zh-Hant"><meta name="viewport" content="width=device-width"><title>人生十五回合</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:24px;background:#f4f7fb;color:#172033}button{padding:12px 18px;margin:6px;font-size:16px}.box{background:white;padding:20px;border-radius:14px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}h1{color:#164e63}</style><body><h1>人生十五回合</h1><p>每回合領收入、付支出，再面對一件人生事件。15 回合後比較淨值。</p><div class="stats"><div class="box"><b>你</b><p id="p"></p></div><div class="box"><b>NPC</b><p id="n"></p></div></div><div class="box"><h2 id="title">準備開始</h2><p id="msg">按下開始，展開你的十五個月。</p><button id="next">開始</button><button id="invest">投資 30</button><button id="reset">重新開始</button></div><div class="box"><b>歷程</b><ol id="log"></ol></div><script>const events=[{t:'交通維修',v:-12},{t:'接到獎金',v:20},{t:'朋友婚禮',v:-10},{t:'兼職收入',v:15},{t:'健康檢查',v:-8},{t:'退稅入帳',v:18},{t:'家電故障',v:-14},{t:'省下一筆錢',v:10},{t:'進修課程',v:-16},{t:'專案獎勵',v:22}];let s;const fresh=()=>({round:0,p:{cash:80,asset:0},n:{cash:80,asset:0},over:false});function worth(x){return x.cash+x.asset}function show(){p.textContent=`現金 ${s.p.cash}｜資產 ${s.p.asset}｜淨值 ${worth(s.p)}`;n.textContent=`現金 ${s.n.cash}｜資產 ${s.n.asset}｜淨值 ${worth(s.n)}`;title.textContent=s.over?'遊戲結束':`第 ${s.round} / 15 回合`;invest.disabled=s.over||s.p.cash<30;next.disabled=s.over}function add(t){log.innerHTML=`<li>${t}</li>`+log.innerHTML}function turn(){if(s.over)return;s.round++;for(const x of [s.p,s.n])x.cash+=12;const e=events[Math.floor(Math.random()*events.length)];s.p.cash+=e.v;s.n.cash+=e.v;if(s.n.cash>=70){s.n.cash-=30;s.n.asset+=36}add(`第${s.round}回合：${e.t}（${e.v>=0?'+':''}${e.v}）`);msg.textContent=`本回合：${e.t}`;if(s.round>=15){s.over=true;const a=worth(s.p),b=worth(s.n);msg.textContent=a===b?'平手！':a>b?'你獲勝！':'NPC 獲勝！'}show()}next.onclick=turn;invest.onclick=()=>{if(!s.over&&s.p.cash>=30){s.p.cash-=30;s.p.asset+=36;add('你投資 30，資產估值增加 36');show()}};reset.onclick=()=>{s=fresh();log.innerHTML='';msg.textContent='按下開始，展開你的十五個月。';show()};reset.click();</script></body></html>
