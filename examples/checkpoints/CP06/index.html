<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CP06 發布候選版</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0;padding:24px}.game{max-width:560px;margin:auto;background:white;padding:28px;border-radius:18px;box-shadow:0 10px 30px #1232}button{padding:12px 18px;border:0;border-radius:10px;background:#174ea6;color:white;font-weight:700;margin-right:8px}@media(max-width:600px){body{padding:10px}.game{padding:20px}}</style><div class="game"><small>CHECKPOINT CP06</small><h1>發布候選版</h1><p>手機可用、可以重玩</p><p>回合：<b id="round">1</b> / 15</p><p>你的結果：<b id="score">$30,000</b></p><p>NPC：<b id="opponent">$30,000</b></p><button id="playBtn" onclick="play()">做出選擇</button><button onclick="reset()">重新開始</button><h2 id="result"></h2></div><script>let cash=30000,npc=30000,round=1;function play(){if(round>15)return;cash+=round%2?2500:-1800;npc+=Math.round((Math.random()-.4)*3000);score.textContent='$'+cash.toLocaleString();opponent.textContent='$'+npc.toLocaleString();document.querySelector('#round').textContent=round;if(round++===15){result.textContent=cash>=npc?'你贏了！':'NPC 獲勝';playBtn.disabled=true}}function reset(){cash=npc=30000;round=1;score.textContent=opponent.textContent='$30,000';result.textContent='';playBtn.disabled=false;document.querySelector('#round').textContent=1}</script></html>
