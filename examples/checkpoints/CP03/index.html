<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CP03 加入現金與事件</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0;padding:24px}.game{max-width:560px;margin:auto;background:white;padding:28px;border-radius:18px;box-shadow:0 10px 30px #1232}button{padding:12px 18px;border:0;border-radius:10px;background:#174ea6;color:white;font-weight:700;margin-right:8px}@media(max-width:600px){body{padding:10px}.game{padding:20px}}</style><div class="game"><small>CHECKPOINT CP03</small><h1>加入現金與事件</h1><p>選擇會影響現金</p><p>回合：<b id="round">1</b> / 15</p><p>你的結果：<b id="score">$30,000</b></p><button id="playBtn" onclick="play()">做出選擇</button><h2 id="result"></h2></div><script>let cash=30000,round=1;function play(){cash+=round%2?2500:-1800;round++;document.querySelector('#score').textContent='$'+cash.toLocaleString();document.querySelector('#round').textContent=Math.min(round,15)}</script></html>
