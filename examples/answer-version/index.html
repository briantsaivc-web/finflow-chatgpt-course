<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生十五回合｜答案版</title>
<style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:760px;margin:36px auto;padding:24px}.panel{background:#fff;border:1px solid #dce3ef;border-radius:18px;padding:24px;box-shadow:0 12px 30px #20304a14}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef5ff;padding:12px;border-radius:12px}.event{font-size:1.15rem;min-height:78px;margin:22px 0;padding:18px;border-left:6px solid #3d8dff;background:#f8fbff}button{border:0;border-radius:12px;padding:12px 18px;margin:4px;background:#172033;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#dce8f8;color:#172033}button:disabled{opacity:.45}.log{font-size:.9rem;color:#53627a;margin-top:18px;max-height:160px;overflow:auto}@media(max-width:620px){.stats{grid-template-columns:1fr 1fr}.wrap{margin:0;padding:12px}}</style>
<div class="wrap"><div class="panel"><h1>人生十五回合</h1><p>你與 NPC 各自做決策，15 回合後比較淨值。</p><div class="stats"><div class="stat">回合<br><b id="round">1 / 15</b></div><div class="stat">現金<br><b id="cash">$30,000</b></div><div class="stat">資產<br><b id="assets">$0</b></div><div class="stat">NPC 淨值<br><b id="npc">$30,000</b></div></div><div class="event" id="event"></div><div id="actions"></div><div class="log" id="log"></div></div></div>
<script>const events=[['朋友邀你參加高價聚餐。',['參加',-3000,0],['婉拒',0,1]],['出現小額投資機會。',['投資',-5000,7500],['保留現金',0,0]],['手機突然故障。',['買新機',-6000,0],['先維修',-1800,0]],['公司發放績效獎金。',['存下來',5000,0],['進修',1000,3500]],['市場下跌，資產打折。',['加碼',-4000,5500],['觀望',0,0]],['朋友推薦保證獲利標的。',['相信他',-8000,1000],['拒絕',0,0]],['有一門實用課程。',['報名',-2500,4000],['略過',0,0]],['家人需要臨時支援。',['幫忙',-3000,0],['不支援',0,0]],['二手設備出清。',['購入',-3500,5000],['放棄',0,0]],['短期旅遊特價。',['出發',-4500,0],['留在家',0,0]]];let state={round:1,cash:30000,assets:0,npc:30000,done:false};const money=n=>'$'+Math.round(n).toLocaleString('zh-TW');const current=()=>events[(state.round-1)%events.length];function render(){round.textContent=`${state.round} / 15`;cash.textContent=money(state.cash);assets.textContent=money(state.assets);npc.textContent=money(state.npc);if(state.done)return;const e=current();event.textContent=e[0];actions.innerHTML='';e.slice(1).forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0];if(i)b.className='secondary';b.disabled=state.cash+a[1]<0;b.onclick=()=>choose(a);actions.append(b)})}function choose(a){state.cash+=a[1];state.assets+=a[2];state.npc+=Math.round((Math.random()-.35)*3500);log.insertAdjacentHTML('afterbegin',`<div>第 ${state.round} 回合：${a[0]}，淨值 ${money(state.cash+state.assets)}</div>`);if(state.round===15){state.done=true;const win=state.cash+state.assets>=state.npc;event.textContent=`完成！你的淨值 ${money(state.cash+state.assets)}，${win?'高於':'低於'} NPC。`;actions.innerHTML='<button onclick="location.reload()">再玩一次</button>'}else{state.round++;render()}}render();</script></html>
