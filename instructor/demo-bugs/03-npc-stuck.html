<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Bug 03 NPC 卡住</title><style>body{font-family:system-ui;max-width:600px;margin:60px auto}button{font-size:18px;padding:12px}</style><h1>NPC 商城回合</h1><button onclick="start()">執行 NPC</button><p id="status">尚未開始</p><script>let npcCash=1000,tries=0,timer;function start(){timer=setInterval(()=>{tries++;status.textContent=`NPC 嘗試購買 $5,000 商品：第 ${tries} 次`;if(npcCash>=5000){clearInterval(timer);status.textContent='購買完成'}},300)}</script></html>
